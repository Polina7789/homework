<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form-container {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid red;
            background: white;
            margin-top: 10px;
            cursor: pointer;
        }

        .facebook-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid blue;
            background: white;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>

</head>
<body>

<div class="form-container">

    <h2>Login | Register</h2>
    <p>Enter your email and password to register.</p>

    <form>

        Username<br>
        <input type="text" placeholder="Enter username">

        Email<br>
        <input type="email" placeholder="Enter email">

        Password<br>
        <input type="password" placeholder="Enter password">

        Confirm Password<br>
        <input type="password" placeholder="Confirm password">

        <input type="submit" value="Register">

    </form>

    <p>Or register with</p>

    <input type="button" value="Continue with Google" class="google-btn">
    <input type="button" value="Continue with Facebook" class="facebook-btn">

</div>

</body>
</html>
